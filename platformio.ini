[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
monitor_speed = 115200
build_flags  =  -D USBD_USE_CDC -DHAL_CAN_MODULE_ENABLED  ; si on veux usb faut le remettre -- > -D USBCON 
lib_deps = pazi88/STM32_CAN@^1.1.2

;Comment the one above and uncomment the ones below to run the debugging tool.
;upload_protocol = stlink
;debug_tool = stlink

